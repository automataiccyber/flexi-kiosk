<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexi Kiosk - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="dashboard-view">
  <div class="dashboard-wrapper">
    <!-- Header: Time & Date -->
    <header>
      <div class="time-display text-center">
        <h1 id="time">--:-- --</h1>
        <div id="date" class="date-display">-- --, ----</div>
      </div>
      <div class="weather-widget">
        <div style="font-size: 2rem; color: #f6ad55;">☀️</div>
        <div style="font-weight: bold; font-size: 1.2rem;">28°C</div>
        <div style="font-size: 0.9rem; color: #718096;">31°C / 24°C</div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Left Column: Announcements (7fr) & Schedule (3fr) -->
      <div class="column">
        <section class="card">
          <div class="card-header header-blue">
            <span>📢</span> ANNOUNCEMENTS
          </div>
          <div class="card-body" id="announcements-list">
            <!-- Dynamic Content -->
          </div>
        </section>

        <section class="card">
          <div class="card-header header-blue">
            <span>⏰</span> DAILY SCHEDULE
          </div>
          <div class="card-body" id="schedule-list">
            <!-- Dynamic Content -->
          </div>
        </section>
      </div>

      <!-- Right Column: Events (7fr) & Media (3fr) -->
      <div class="column">
        <section class="card">
          <div class="card-header header-green">
            <span>📅</span> UPCOMING EVENTS
          </div>
          <div class="card-body" id="events-list">
            <!-- Dynamic Content -->
          </div>
        </section>

        <section class="media-container" id="media-content">
          <!-- Dynamic Content -->
        </section>
      </div>
    </main>

    <!-- Footer: Ticker -->
    <footer>
      <div class="live-indicator">
        <div class="dot"></div>
        LIVE
      </div>
      <div class="ticker-wrap">
        <div class="ticker-move" id="ticker-text">Loading ticker message...</div>
      </div>
      <div id="voice-mic" title="Voice Control (click, then say: Hey Flexi)" style="margin-left: auto; display: flex; align-items: center; gap: 0.5rem; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 20px; cursor: pointer;">
        <span style="font-size: 0.95rem;">🎤</span>
        <span style="font-size: 0.8rem;">VOICE</span>
      </div>
    </footer>
  </div>

  <div id="voice-overlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 1000;">
    <div style="width: 640px; max-width: 90vw; background: #fff; color: #1a202c; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);">
      <div style="display:flex; justify-content:space-between; align-items:center; padding: 12px 16px; border-bottom: 1px solid #edf2f7;">
        <div id="voice-title" style="font-weight:bold;">Voice Result</div>
        <button id="voice-close" style="background:#edf2f7; border:0; padding:6px 10px; border-radius:8px; cursor:pointer;">Close</button>
      </div>
      <div id="voice-content" style="padding: 14px 16px;"></div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
