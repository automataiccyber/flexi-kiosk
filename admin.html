<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexi Kiosk - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="admin-view">
  <div class="admin-container">
    <!-- Top Navigation Header -->
    <header class="admin-header">
      <nav class="top-nav">
        <button class="nav-btn active"><span class="nav-label">Announcements</span></button>
        <button class="nav-btn" onclick="window.location='events.html'"><span class="nav-label">Upcoming Events</span></button>
        <button class="nav-btn" onclick="window.location='facility.html'"><span class="nav-label">Facility Status</span></button>
        <button class="nav-btn" onclick="window.location='highlights.html'"><span class="nav-label">Highlights</span></button>
        <button class="nav-btn" onclick="window.location='ticker.html'"><span class="nav-label">Ticker</span></button>
      </nav>
    </header>

    <main class="content-area">
      
      <!-- Announcements Section -->
      <section id="announcements" class="admin-section active">
        <!-- Title Input (10% height) -->
        <div class="ann-row h-101">
          <div class="label-input">
            <label>Title</label>
            <input type="text" id="ann-title" placeholder="Enter title">
          </div>
        </div>

        <!-- Description Input (10% height) -->
        <div class="ann-row h-10">
          <div class="label-input">
            <label>Description</label>
            <input type="text" id="ann-desc" placeholder="Short description">
          </div>
        </div>

        <!-- Meta Input (Date, Time, Icon) (10% height) -->
        <div class="ann-row h-102">
          <div class="meta-group">
            <div class="label-input">
              <label>Start Date</label>
              <input type="date" id="ann-start-date">
            </div>
            <div class="label-input">
              <label>Start Time</label>
              <input type="time" id="ann-start-time">
            </div>
            <div class="label-input">
              <label>End Date</label>
              <input type="date" id="ann-date">
            </div>
            <div class="label-input">
              <label>End Time</label>
              <input type="time" id="ann-time">
            </div>
            <div class="label-input">
              <label>Icon</label>
              <select id="ann-icon">
                <option value="📢">📢</option>
                <option value="🔔">🔔</option>
                <option value="⚠️">⚠️</option>
                <option value="🎉">🎉</option>
                <option value="📅">📅</option>
                <option value="🏆">🏆</option>
                <option value="⚽">⚽</option>
                <option value="🎵">🎵</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Add Button (5% height) -->
        <div class="ann-row h-5">
          <button id="ann-add-btn" class="btn-action full">Add</button>
        </div>

        <!-- Announcement List (40% height) -->
        <div class="ann-row h-40 list-container">
          <div id="announcements-admin-list" class="scroll-content"></div>
        </div>

        <!-- Action Buttons (10% height) -->
        <div class="ann-row h-10 actions-container">
          <button id="ann-save-btn" class="btn-save">Save</button>
          <a href="dashboard.html" class="btn-link">Dashboard</a>
        </div>
      </section>

    </main>
  </div>

  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
