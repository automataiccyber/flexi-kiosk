<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexi Kiosk - Facility Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="admin-view">
  <div class="admin-container">
    <header class="admin-header">
      <nav class="top-nav">
        <button class="nav-btn" onclick="window.location='admin.html'"><span class="nav-label">Announcements</span></button>
        <button class="nav-btn" onclick="window.location='events.html'"><span class="nav-label">Upcoming Events</span></button>
        <button class="nav-btn active"><span class="nav-label">Facility Status</span></button>
        <button class="nav-btn" onclick="window.location='highlights.html'"><span class="nav-label">Highlights</span></button>
        <button class="nav-btn" onclick="window.location='ticker.html'"><span class="nav-label">Ticker</span></button>
      </nav>
    </header>
    <main class="content-area">
      <section id="facility" class="admin-section active">
        <div class="facility-grid-container">
          <!-- Left Column -->
          <div class="facility-col1">
            <div class="form-group"><label>Clinic</label>
              <select id="clinic-status"><option>Open</option><option>On Break</option><option>Close</option></select>
            </div>
            
            <div class="form-group"><label>Admin</label>
              <select id="admin-status"><option>Open</option><option>On Break</option><option>Close</option></select>
            </div>
            <div class="form-group"><label>Proware</label>
               <select id="proware-status"><option>Open</option><option>On Break</option><option>Close</option></select>
             </div>
          </div>
          <!-- Right Column -->
          <div class="facility-col2">
            <div class="form-group"><label>Library</label>
              <select id="library-status"><option>Open</option><option>On Break</option><option>Close</option></select>
            </div>
             <div class="form-group"><label>Registrar</label>
               <select id="registrar-status"><option>Open</option><option>On Break</option><option>Close</option></select>
             </div>
             
             <div class="form-group"><label>D.O</label>
               <select id="do-status"><option>Open</option><option>On Break</option><option>Close</option></select>
             </div>
          </div>
        </div>
        <div class="ann-row actions-container h-10">
          <button id="facility-save-btn" class="btn-save">Save</button>
          <a href="dashboard.html" class="btn-link">Dashboard</a>
        </div>
      </section>
    </main>
  </div>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
