<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexi Kiosk - Facility Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="admin-view">
  <div class="admin-container">
    <header class="admin-header">
      <nav class="top-nav">
        <button class="nav-btn" onclick="window.location='admin.html'"><span class="nav-label">Announcements</span></button>
        <button class="nav-btn" onclick="window.location='events.html'"><span class="nav-label">Upcoming Events</span></button>
        <button class="nav-btn active"><span class="nav-label">Facility Status</span></button>
        <button class="nav-btn" onclick="window.location='highlights.html'"><span class="nav-label">Highlights</span></button>
        <button class="nav-btn" onclick="window.location='ticker.html'"><span class="nav-label">Ticker</span></button>
      </nav>
    </header>
    <main class="content-area">
      <section id="facility" class="admin-section active">
        <div class="ann-row h-101">
          <div class="label-input">
            <label>Facility Name</label>
            <input type="text" id="fac-title" placeholder="Enter facility name">
          </div>
        </div>
        <div class="ann-row h-102">
          <div class="meta-group">
            <div class="label-input">
              <label>Open</label>
              <input type="time" id="fac-open">
            </div>
            <div class="label-input">
              <label>Break Start</label>
              <input type="time" id="fac-break-start">
            </div>
            <div class="label-input">
              <label>Break End</label>
              <input type="time" id="fac-break-end">
            </div>
            <div class="label-input">
              <label>Close</label>
              <input type="time" id="fac-close">
            </div>
          </div>
        </div>
        <div class="ann-row h-5">
          <button id="fac-add-btn" class="btn-action full">Add</button>
        </div>
        <div class="facility-grid-container" id="facility-admin-list">
          <div id="facility-custom-list-left" class="facility-col1"></div>
          <div id="facility-custom-list-right" class="facility-col2"></div>
        </div>
        <div class="ann-row actions-container h-10">
          <button id="facility-save-btn" class="btn-save">Save</button>
          <a href="dashboard.html" class="btn-link">Dashboard</a>
        </div>
      </section>
    </main>
  </div>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
